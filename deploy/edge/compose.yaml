# The shared edge Caddy (compose project "edge", /srv/edge on the VM). Host network: it binds
# 80 and 443 and reaches each app on 127.0.0.1. Certificates live on the data disk, owned by the
# uid Caddy runs as (EDGE_UID, created by the host bootstrap).
name: edge

services:
  caddy:
    # caddy 2.11.6 on Alpine (pushed 2026-10-04), pinned by multi-arch index digest. The stock
    # binary's cap_net_bind_service file capability is exactly what binding 80/443 as non-root needs.
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    network_mode: host
    user: "${EDGE_UID:-10002}:${EDGE_UID:-10002}"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      EDGE_CA_OPTION: ${EDGE_CA_OPTION:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      # Certificates and ACME account (XDG_DATA_HOME=/data in the image).
      - ${EDGE_DATA:-/data/edge}/caddy:/data
    tmpfs:
      - /config:uid=${EDGE_UID:-10002},gid=${EDGE_UID:-10002},mode=0700
      - /run/caddy:uid=${EDGE_UID:-10002},gid=${EDGE_UID:-10002},mode=0700
    mem_limit: ${EDGE_MEM:-64m}
    logging:
      driver: local
      options: { max-size: 10m, max-file: "3" }
    healthcheck:
      # The Caddyfile's loopback-only liveness site.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2080/"]
      interval: 30s
      timeout: 3s
      retries: 3
