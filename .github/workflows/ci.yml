name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's older runs are cancelled. On main every push runs to the end: a docs-only push
# skips the images job, and the deploy waits on that job, so a code push must never be cancelled
# by a docs push that follows it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash gives `bash --noprofile --norc -eo pipefail`; piped steps also set it themselves.
    shell: bash

jobs:
  # Docs-only changes (docs/, *.md) skip the images and perf jobs, and so the deploy. Anything else,
  # or a diff that can't be computed (a new branch, a force push), counts as code.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docs only?
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          if [[ ! $BASE =~ ^[0-9a-f]{40}$ || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no base to compare with: treated as code"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          printf '%s\n' "$files"
          if grep -qvE '(^docs/|\.md$)' <<<"$files"; then echo "code=true"; else echo "code=false"; fi | tee -a "$GITHUB_OUTPUT"

  # The whole history, on every push: the repo is public.
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history; known false positives in .gitleaksignore)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner --exit-code 1

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image and digest as compose.yaml.
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: chitthi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chitthi
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U chitthi -d chitthi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Owner: migrations and test setup only. The API and app-level tests log in as chitthi_api.
      MIGRATION_DATABASE_URL: postgres://chitthi:ci-only-password@127.0.0.1:5435/chitthi?sslmode=disable
      TEST_DATABASE_URL: postgres://chitthi:ci-only-password@127.0.0.1:5435/chitthi?sslmode=disable
      DATABASE_URL: postgres://chitthi_api:ci-only-api-password@127.0.0.1:5435/chitthi?sslmode=disable
      TEST_API_DATABASE_URL: postgres://chitthi_api:ci-only-api-password@127.0.0.1:5435/chitthi?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Migrate
        run: npm run db:migrate
      - name: Set the API login password
        run: npm run db:api-password
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      # High and above fails, except advisories in audit-exceptions.json, each only until the day
      # its fix clears the 14-day release rule (scripts/audit.sh).
      - name: Audit (high and above)
        run: scripts/audit.sh

  images:
    # The production images (api/Dockerfile, web/Dockerfile), built on every push and checked on
    # their own (non-root, read-only, no capabilities, config refusal, sharp's musl build, the web
    # page's headers and routing), then as the production stack: deploy/chitthi and deploy/edge
    # brought up as committed, smoke-tested through TLS, and measured for memory
    # (deploy/smoke/smoke.sh prints the MEMORY table). Publishing comes with the deploy workflow.
    # Skipped for docs-only changes; the deploy workflow deploys only when this job passed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # test-deploy.sh signs in to ghcr.io with this job's token, as the VM does
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck scripts/check-images.sh scripts/audit.sh deploy/smoke/smoke.sh deploy/host/*.sh deploy/azure/*.sh
      - name: Build the API image
        run: docker build -f api/Dockerfile --target api -t chitthi-api:ci .
      - name: Build the migrate image
        run: docker build -f api/Dockerfile --target migrate -t chitthi-migrate:ci .
      - name: Build the web image
        run: docker build -f web/Dockerfile -t chitthi-web:ci .
      - name: Check the images
        run: scripts/check-images.sh chitthi-api:ci chitthi-migrate:ci chitthi-web:ci
      - name: Image sizes
        run: |
          set -o pipefail
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':ci '
      # The smoke workload runs on the runner with the repo's socket.io-client and sharp.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      # The runner becomes a production host (same Ubuntu 24.04 as the VM), with a loop file as
      # the data disk. Twice: the second run must converge without changes or failures.
      - name: Bootstrap the runner as a production host (twice)
        run: |
          truncate -s 1G "$RUNNER_TEMP/data-disk.img"
          dev=$(sudo losetup --find --show "$RUNNER_TEMP/data-disk.img")
          sudo DATA_DEVICE="$dev" SWAP_SIZE=512M deploy/host/bootstrap.sh
          sudo DATA_DEVICE="$dev" SWAP_SIZE=512M deploy/host/bootstrap.sh
      # The Cloud Shell tools (deploy/azure): the backup keypair generator against the real age
      # (installed by the bootstrap), SigV4 against AWS's test vector, the compaction's rules.
      - name: Test the Cloud Shell tools
        run: REQUIRE_AGE=1 REQUIRE_YAML=1 python3 -B -m unittest discover -s deploy/azure -v
      - name: Smoke-test and measure the production stack
        run: deploy/smoke/smoke.sh chitthi-api:ci chitthi-migrate:ci chitthi-web:ci
      - name: Deploy, re-deploy, a broken deploy that rolls itself back, explicit rollback
        env:
          # The first deploy fetches its files through the API with this job's own short-lived
          # token, exactly as the VM does with the deploy workflow's (needed while the repo was
          # private; kept so the token path stays tested).
          CHITTHI_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: deploy/host/test-deploy.sh
      # As after enlarging the data disk in Azure: the loop file grows by half, then the script
      # grows the mounted filesystem with the stack running.
      - name: Grow the data disk while mounted
        run: |
          set -o pipefail
          before=$(df -BM --output=size /data | tail -n 1 | tr -dc '0-9')
          truncate -s 1536M "$RUNNER_TEMP/data-disk.img"
          sudo losetup -c "$(findmnt -no SOURCE /data)"
          sudo deploy/host/grow-data-disk.sh
          after=$(df -BM --output=size /data | tail -n 1 | tr -dc '0-9')
          (( after > before + 400 )) || { echo "/data did not grow: $before -> $after MiB"; exit 1; }
          sudo docker compose -p chitthi --project-directory /srv/chitthi ps --status running --services | grep -qx api
      - name: Host status report
        run: |
          set -o pipefail
          sudo deploy/host/status.sh | tee "$RUNNER_TEMP/status.txt"
          grep -q 'last-success: ' "$RUNNER_TEMP/status.txt"
          grep -q 'chitthi-api-1' "$RUNNER_TEMP/status.txt"

  perf:
    # Timing-sensitive tests (npm run test:perf): their own job, so they can't make the main
    # gate flaky. They print LATENCY / STAGES / WORST lines (docs/REALTIME.md) and assert only
    # loose bounds. Skipped for docs-only changes.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same image and digest as compose.yaml.
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: chitthi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chitthi
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U chitthi -d chitthi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://chitthi:ci-only-password@127.0.0.1:5435/chitthi?sslmode=disable
      TEST_DATABASE_URL: postgres://chitthi:ci-only-password@127.0.0.1:5435/chitthi?sslmode=disable
      DATABASE_URL: postgres://chitthi_api:ci-only-api-password@127.0.0.1:5435/chitthi?sslmode=disable
      TEST_API_DATABASE_URL: postgres://chitthi_api:ci-only-api-password@127.0.0.1:5435/chitthi?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Migrate
        run: npm run db:migrate
      - name: Set the API login password
        run: npm run db:api-password
      - name: Performance tests (200-socket latency, 20 concurrent senders)
        run: npm run test:perf

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: chitthi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chitthi
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U chitthi -d chitthi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://chitthi:ci-only-password@127.0.0.1:5435/chitthi?sslmode=disable
      DATABASE_URL: postgres://chitthi_api:ci-only-api-password@127.0.0.1:5435/chitthi?sslmode=disable
      # The API as the browser tests use it: dev sign-in on (test env only), the web origin allowed.
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "8082"
      WEB_ORIGINS: http://localhost:5175
      DEV_LOGIN: "true"
      RATE_LIMIT_AUTH: "5000"
      # Uploads go to RAM-backed /dev/shm: the API refuses uploads when the disk holding them has
      # less than max(15 %, 2 GB) free, and some runners' disks do.
      E2E_MEDIA_DIR: /dev/shm/chitthi-e2e-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (npm ci)
        run: npm ci
      - name: Migrate
        run: npm run db:migrate
      - name: Set the API login password
        run: npm run db:api-password
      - name: Install Playwright Chromium (version pinned by package-lock)
        run: npm run e2e:install -w web
      - name: End-to-end tests (390 px and desktop, axe on every screen)
        run: npm run e2e
      # Every run, not only failed ones: a test that failed once and passed on its retry still
      # leaves its trace here (retain-on-failure keeps the failed attempt).
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
